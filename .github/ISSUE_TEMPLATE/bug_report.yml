name: Rapport de bug
description: Signaler un dysfonctionnement du composant audio-view
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que se passe-t-il ? Qu'attendiez-vous ?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Charger le WAV ...
        2. Cliquer sur ...
        3. ...
    validations:
      required: true
  - type: input
    id: environnement
    attributes:
      label: Environnement
      placeholder: "OS, version JDK, version JavaFX, version audio-view"
    validations:
      required: false
