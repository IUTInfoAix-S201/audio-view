# Déploiement manuel vers Maven Central (issue #25).
#
# Publie la DERNIÈRE release (dernier tag git) du composant vers Maven Central. Le workflow
# release.yml déploie automatiquement quand semantic-release crée un nouveau tag ; ce workflow-ci
# sert aux cas où l'on veut publier MANUELLEMENT : premier déploiement après l'activation des
# secrets, republication après échec de release.yml.
#
# Le job checkout `main` (pas le tag) car la plomberie de release (profil "release", settings
# Maven, métadonnées Central dans le pom) n'est présente qu'à partir du commit qui l'a introduite.
# La version du pom est alignée sur le dernier tag (`versions:set`) avant `deploy`. Conséquence :
# on ne PEUT PAS republier rétroactivement des versions antérieures à cette plomberie ; Central
# démarrera à la première release publiée par ce workflow.
#
# Déclenchement : onglet "Actions" → "deploy-central" → "Run workflow". Nécessite les 4 secrets :
# CENTRAL_USERNAME, CENTRAL_PASSWORD, GPG_PRIVATE_KEY, GPG_PASSPHRASE.
name: deploy-central

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # pour récupérer tous les tags

      - name: Récupérer la dernière version
        id: tag
        run: |
          git fetch --tags --force
          LAST_TAG=$(git describe --tags --abbrev=0)
          echo "value=${LAST_TAG}" >> "$GITHUB_OUTPUT"
          echo "Version à publier : ${LAST_TAG}"

      - name: Configurer JDK 25 (Temurin)
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Importer la clé GPG
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          # Le runner GitHub n'autorise pas pinentry-mode loopback par défaut → on l'active
          # explicitement et on redémarre gpg-agent avant l'import.
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG

      - name: Publier sur Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          # maven-gpg-plugin 3.x lit MAVEN_GPG_PASSPHRASE automatiquement (pas GPG_PASSPHRASE).
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          VERSION: ${{ steps.tag.outputs.value }}
        run: |
          VERSION_NUM="${VERSION#v}"
          ./mvnw -B --no-transfer-progress versions:set -DnewVersion="$VERSION_NUM" -DgenerateBackupPoms=false
          ./mvnw -B --no-transfer-progress -Prelease -DskipTests \
            --settings .github/maven-settings.xml \
            deploy
