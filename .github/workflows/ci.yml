name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # JDK Zulu 25 avec JavaFX embarque (jdk+fx) : fournit les modules javafx.*
      # comme modules systeme (comme en local). Aligne sur la CI des TP R2.02.
      - name: Configurer JDK 25 avec JavaFX (Zulu)
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'
          java-package: 'jdk+fx'
          cache: maven

      # Les tests TestFX ont besoin d'un affichage : on utilise un serveur X virtuel.
      - name: Build et tests (headless)
        run: xvfb-run -a mvn -B verify
