name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Temurin 25 (JDK vanilla)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # JDK vanilla (sans JavaFX embarque) : les modules OpenJFX viennent des artefacts
      # Maven classifies, pas du JDK, ce qui prouve la portabilite et reflete le build JitPack.
      #
      # Plus de job Zulu jdk+fx : son JavaFX 25 embarque masque les jars FX 26 du module-path,
      # or la Headless Platform (glass.platform=Headless) n'existe qu'en FX 26. Les tests TestFX
      # y echouaient donc en NPE (com.sun.glass.ui.PlatformFactory.getPlatformFactory() null).
      # Meme raison que le retrait du jdk+fx en CI cote TP R2.02.
      - name: Configurer JDK 25 (Temurin, vanilla)
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          java-package: jdk
          cache: maven

      # Quality gate complet : enforcer + Spotless(off) + PMD strict (-Pquality-gate) +
      # SpotBugs + JaCoCo + tests TestFX (JavaFX 26 Headless Platform, en mémoire, sans serveur X).
      - name: Build, qualité et tests (headless)
        run: ./mvnw -B -Pquality-gate verify
