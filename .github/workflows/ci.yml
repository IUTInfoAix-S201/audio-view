name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurer Temurin 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Les tests TestFX ont besoin d'un affichage : on utilise un serveur X virtuel.
      - name: Build et tests (headless)
        run: xvfb-run -a mvn -B verify
