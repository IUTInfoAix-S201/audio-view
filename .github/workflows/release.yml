# Release automatique (semantic-release) basée sur les Conventional Commits.
# Sur push sur main : analyse les commits depuis le dernier tag, calcule la version
# (feat -> minor, fix -> patch, BREAKING -> major), crée le tag vX.Y.Z + la release
# GitHub (avec notes de version) en UN seul run, avec le GITHUB_TOKEN (pas de PAT,
# pas de PR).
#
# Préchauffage JitPack (NON BLOQUANT) : le plugin @semantic-release/exec (étape publish,
# en dernier dans .releaserc.json) sonde l'artefact JitPack du tag fraîchement créé en
# POLLING (JitPack build à la demande : il renvoie 404 tant que le tag n'est pas bâti,
# ~90 s ; on réessaie toutes les 20 s jusqu'à ~10 min) pour réchauffer le cache JitPack
# (canal secondaire). En cas de 404 persistant, il émet un AVERTISSEMENT sans faire
# échouer le run : la publication Maven Central (canal principal, étapes suivantes du job)
# ne doit JAMAIS être bloquée par un aléa JitPack. On le fait dans CE job (pas via un
# workflow "on: push: tags") car un tag créé par le GITHUB_TOKEN ne déclenche pas d'autre
# workflow.
#
# Config minimale (.releaserc.json) : pas de commit de CHANGELOG sur main (les notes
# vivent dans la release GitHub), donc aucun commit parasite.
name: release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release a besoin de tout l'historique + les tags

      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      - name: semantic-release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes -p semantic-release -p @semantic-release/exec semantic-release

      # Publication Maven Central (issue #25). Conditionnel : ne s'exécute que si :
      # - un tag vient d'être créé (semantic-release a vu un feat:/fix:/BREAKING) ;
      # - les secrets CENTRAL_USERNAME et GPG_PRIVATE_KEY sont configurés.
      # Sinon (chore:/refactor:/docs:/test:/ci: sans nouveau tag, OU release prête mais
      # déploiement Central pas encore activé), le step est sauté silencieusement.
      - name: Récupérer le tag fraîchement créé
        id: tag
        run: |
          git fetch --tags --force
          NEW_TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || echo "")
          echo "value=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "Nouveau tag : ${NEW_TAG:-(aucun)}"

      - name: Configurer JDK 25 (Temurin)
        if: steps.tag.outputs.value != '' && env.CENTRAL_USERNAME != ''
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Importer la clé GPG
        if: steps.tag.outputs.value != '' && env.GPG_PRIVATE_KEY != ''
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          # Le runner GitHub n'autorise pas pinentry-mode loopback par défaut → on l'active
          # explicitement et on redémarre gpg-agent avant l'import.
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG

      - name: Publier sur Maven Central
        if: steps.tag.outputs.value != '' && env.CENTRAL_USERNAME != '' && env.GPG_PRIVATE_KEY != ''
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          # maven-gpg-plugin 3.x lit MAVEN_GPG_PASSPHRASE automatiquement (pas GPG_PASSPHRASE).
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          VERSION: ${{ steps.tag.outputs.value }}
        run: |
          # Le pom.xml garde sa version "de travail" : on l'aligne sur le tag avant deploy.
          VERSION_NUM="${VERSION#v}"
          ./mvnw -B --no-transfer-progress versions:set -DnewVersion="$VERSION_NUM" -DgenerateBackupPoms=false
          ./mvnw -B --no-transfer-progress -Prelease -DskipTests \
            --settings .github/maven-settings.xml \
            deploy
