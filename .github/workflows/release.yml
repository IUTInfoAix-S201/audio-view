# Release automatique (semantic-release) basée sur les Conventional Commits.
# Sur push sur main : analyse les commits depuis le dernier tag, calcule la version
# (feat -> minor, fix -> patch, BREAKING -> major), crée le tag vX.Y.Z + la release
# GitHub (avec notes de version) en UN seul run, avec le GITHUB_TOKEN (pas de PAT,
# pas de PR).
#
# Smoke-test + préchauffage JitPack : le plugin @semantic-release/exec (étape publish,
# en dernier dans .releaserc.json) sonde l'artefact JitPack du tag fraîchement créé en
# POLLING (JitPack build à la demande : il renvoie 404 tant que le tag n'est pas bâti,
# ~90 s ; on réessaie toutes les 20 s jusqu'à ~10 min). Si JitPack n'arrive jamais à
# servir le tag, le run vire au rouge ICI (au lieu qu'un étudiant tombe sur un 404 plus
# tard) et le cache est chaud pour le premier vrai consommateur. On le fait dans CE job
# (pas via un workflow "on: push: tags") car un tag créé par le GITHUB_TOKEN ne déclenche
# pas d'autre workflow.
#
# Config minimale (.releaserc.json) : pas de commit de CHANGELOG sur main (les notes
# vivent dans la release GitHub), donc aucun commit parasite.
name: release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # semantic-release a besoin de tout l'historique + les tags

      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes -p semantic-release -p @semantic-release/exec semantic-release
