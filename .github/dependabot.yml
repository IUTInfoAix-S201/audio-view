version: 2
updates:
  # Dépendances Maven (JavaFX, JUnit, AssertJ, TestFX, plugins qualité...)
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "maven"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # JavaFX reste figé sur la cible 25 (invariant projet) ; pas de bump auto.
      - dependency-name: "org.openjfx:*"

  # Actions GitHub utilisées dans les workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
